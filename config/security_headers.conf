add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.datatables.net https://www.google.com https://www.gstatic.com https://ga.jspm.io; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.datatables.net; img-src 'self' data: https://www.w3.org http://www.w3.org; form-action 'self'; base-uri 'self'; connect-src 'self' ws: wss: https://static.cloudflareinsights.com https://cloudflareinsights.com https://cdn.jsdelivr.net https://www.google.com https://ga.jspm.io; font-src 'self' https://cdn.jsdelivr.net; frame-src 'self' https://www.google.com; object-src 'none'; media-src 'self'; child-src 'self'; frame-ancestors 'none'" always;