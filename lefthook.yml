pre-commit:
  parallel: true
  jobs:
    - name: backend
      group:
        piped: true
        jobs:
          - name: format
            root: "app/"
            run: box run-script format
    - name: frontend
      group:
        piped: true
        jobs:
          - name: format
            root: "app/includes/"
            run: npm run-script format
          - name: lint
            root: "app/includes/"
            run: npm run lint:fix
          - name: minJS
            root: "app/includes/"
            run: npm run-script minJS
          - name: minCSS
            root: "app/includes/"
            run: npm run-script minCSS
    - name: envcheck
      root: "app/"
      run: box dotenv check --reverse

post-checkout:
  parallel: true
  commands:
    box-install:
      root: "app/"
      run: box install
    npm-install:
      root: "app/includes/"
      run: npm install
    box-fix-json-lineending:
      run: echo 'config set JSON.lineEnding=`#chr 10`' | box
