name: Test Suite

permissions:
  contents: read
  checks: write
  id-token: write

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch: # Allow manual triggering

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-24.04
    environment: Test
    timeout-minutes: 45

    # Set default working directory for all run steps
    defaults:
      run:
        working-directory: ./app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: postgres_docker
          POSTGRES_DB: test_pogotracker
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup CommandBox CLI
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          version: latest

      - name: Create .env file
        run: |
          cat > .env << 'EOL'
          ENVIRONMENT=test
          CFCONFIG_ADMINPASSWORD=commandbox
          LUCEE_ADMIN_ENABLED=false
          INSPECTTEMPLATE=never
          IMAGEMAGICKPATH=/usr/bin
          HTTP_PORT=8084
          HTTP_HOST=0.0.0.0
          REQUESTTIMEOUT=60
          SESSIONTIMEOUT=30
          OS=linux
          JAVAHEAP=2048
          JAVAMINHEAP=512
          DB_HOST=localhost
          DB_PORT=5435
          DB_NAME=test_pogotracker
          DB_SCHEMA=public
          DB_USERNAME=runner
          DB_PASSWORD=postgres_docker
          DB_BUNDLEVERSION=42.7.7
          EMAIL_SERVER=localhost
          EMAIL_PORT=587
          EMAIL_USERNAME=noreply@pogotracker.app
          EMAIL_PASSWORD=test
          EMAIL_TLS=false
          EMAIL_SSL=false
          EMAIL_SPOOL=false
          ALGORITHM=SHA-512
          ITERATIONS=2
          PEPPER=AAAAAAAAAAAAAAAAAAAAAAAAAAAA
          REINITKEY=
          RECAPTCHASITEKEY=${{ secrets.RECAPTCHASITEKEY }}
          RECAPTCHASECRETKEY=${{ secrets.RECAPTCHASECRETKEY }}
          EOL

      - name: Install Dependencies
        run: |
          box install

      - name: Verify Database Connection
        working-directory: . # Override for this step since it doesn't need to be in /app
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5435 -U runner; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          psql -h localhost -p 5435 -U runner -d test_pogotracker -c "SELECT version();"
        env:
          PGPASSWORD: postgres_docker

      - name: Run Database Migrations
        run: |
          box migrate install --verbose
          box migrate up --verbose
        continue-on-error: false

      - name: Seed Database
        run: |
          box migrate seed run --verbose
        continue-on-error: false

      - name: Start CommandBox Server
        run: |
          box server start --verbose
        timeout-minutes: 2

      - name: Wait for Server to be Ready
        run: |
          echo "Waiting for server to start..."
          for i in {1..60}; do
            if curl -sf http://localhost:8084 > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "Server failed to start"
          box server log
          exit 1

      # TestBox Tests
      - name: Run TestBox Tests
        id: run_tests
        run: |
          mkdir -p tests/results
          box testbox run --verbose outputFile="tests/results/test-results" outputFormats="json,antjunit" \
            || echo "TESTS_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true
        timeout-minutes: 15

      - name: Display Test Results
        if: always()
        run: |
          if [ -f "tests/results/test-results.json" ]; then
            echo "=== Test Results Summary ==="
            cat tests/results/test-results.json | jq -r '
              "Total Bundles: \(.totalBundles)",
              "Total Suites: \(.totalSuites)", 
              "Total Specs: \(.totalSpecs)",
              "Total Pass: \(.totalPass)",
              "Total Fail: \(.totalFail)",
              "Total Error: \(.totalError)",
              "Total Skipped: \(.totalSkipped)"
            '
          else
            echo "No test results found!"
            ls -la tests/results/ || echo "Results directory doesn't exist"
          fi
        continue-on-error: true

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@v6.0.0
        if: always()
        with:
          report_paths: |
            app/tests/results/**/*.xml
          check_name: "TestBox Report"
          include_passed: false
          fail_on_failure: true
          detailed_summary: true
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/tests/results/
            app/tests/results/*.json
            app/tests/results/*.xml
          retention-days: 30
        continue-on-error: true

      # Playwright Tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/includes/package-lock.json

      - name: Clean Install Dependencies
        working-directory: ./app/includes
        run: |
          npm ci
          npm run install:browsers

      - name: Run Playwright Tests
        id: run_playwright_tests
        working-directory: ./app/includes
        run: |
          npx playwright test
        continue-on-error: true
        timeout-minutes: 15
        env:
          CI: true
          BASE_URL: http://localhost:8084

      - name: Display Playwright Results
        if: always()
        working-directory: ./app/includes
        run: |
          if [ -f "playwright-report/index.html" ]; then
            echo "=== Playwright Results Summary ==="
            # Extract pass/fail counts from the JSON results if available
            if [ -f "test-results/.last-run.json" ]; then
              cat test-results/.last-run.json | jq -r '
                "Status: \(.status)",
                "Failed: \(.failedTests | length)"
              ' 2>/dev/null || echo "Could not parse Playwright results JSON"
            fi
          else
            echo "No Playwright report found"
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            app/includes/playwright-report/
            app/includes/test-results/
          retention-days: 30
        continue-on-error: true

      - name: Publish Playwright Results
        uses: mikepenz/action-junit-report@v6.0.0
        if: always()
        with:
          report_paths: |
            app/includes/test-results/**/*.xml
          check_name: "Playwright Report"
          include_passed: false
          fail_on_failure: true
          detailed_summary: true
        continue-on-error: true

      - name: Stop Server
        if: always()
        run: |
          box server stop --force
