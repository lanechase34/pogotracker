name: Deploy

on:
  workflow_dispatch: # Manual triggering

jobs:
  deploy:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/includes/package-lock.json

      - name: Build JS and CSS assets
        working-directory: ./app/includes
        run: |
          npm ci
          npm run minJS
          npm run minCSS

      - name: Update backend code
        uses: burnett01/rsync-deployments@70ff22f5b4c2bb0e08d0bf20de693389e5552047 #v8
        # a - archive preserve permissions, ownership, and symbolic links, v - verbose, z - compress
        with:
          switches: -avz --rsync-path="sudo rsync"
            --exclude='.env'
            --exclude='includes/uploads/'
            --exclude='includes/.terser.json'
            --exclude='includes/eslint.config.js'
            --exclude='includes/package-lock.json'
            --exclude='includes/package.json'
            --exclude='includes/css/'
            --exclude='includes/node_modules/'
            --exclude='includes/assets/envpokedexoverrides.json'
            --include='includes/build/js/modules/***'
            --exclude='includes/js/'
            --exclude='includes/tests/'
            --exclude='includes/.eslintignore'
            --exclude='includes/.prettierignore'
            --exclude='includes/.prettierrc'
            --exclude='includes/playwright.config.js'
            --exclude='handlers/dev.cfc'
            --exclude='includes/sitemap.xml'
            --exclude='coldbox/'
            --include='config/modules/***'
            --exclude='modules/'
            --exclude='tests/'
            --exclude='database/seeds/'
            --exclude='_testemails/'
            --exclude='.cfformat.json'
          path: ./app/
          remote_path: /var/www/wwwroot/pogotracker/
          remote_host: ${{ secrets.LIGHTSAIL_IP }}
          remote_user: ${{ secrets.LIGHTSAIL_USERNAME }}
          remote_key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Restart, update backend db, and dependencies
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: "${{ secrets.LIGHTSAIL_SSH_KEY }}"
          script: |
            sudo sh -c 'echo "$(date)" > /var/www/wwwroot/pogotracker/version.html'
            cd /var/www/wwwroot/pogotracker/
            sudo box recipe scripts/deploy.boxr
          timeout-minutes: 10
